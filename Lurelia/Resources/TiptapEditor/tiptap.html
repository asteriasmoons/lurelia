<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Tiptap</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: transparent;
        --fg: #ffffff;
        --fg-secondary: rgba(255, 255, 255, 0.62);
        --accent: #03dbfc;
        --accent-2: #7d19f7;
        --surface: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.14);
        --radius: 12px;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Rounded",
          "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        overflow-x: hidden;
        overscroll-behavior: contain;
      }
      #editor-root {
        padding: 12px 16px 96px;
        min-height: 100dvh;
      }
      .ProseMirror {
        outline: none;
        min-height: 240px;
        color: var(--fg);
      }
      .ProseMirror p.is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        color: var(--fg-secondary);
        float: left;
        pointer-events: none;
        height: 0;
      }
      .ProseMirror h1 {
        font-size: 26px;
        font-weight: 900;
        margin: 18px 0 10px;
        letter-spacing: -0.01em;
      }
      .ProseMirror h2 {
        font-size: 22px;
        font-weight: 900;
        margin: 16px 0 8px;
        letter-spacing: -0.01em;
      }
      .ProseMirror h3 {
        font-size: 19px;
        font-weight: 800;
        margin: 14px 0 6px;
      }
      .ProseMirror blockquote {
        border-left: 3px solid var(--accent);
        padding-left: 14px;
        margin: 12px 0;
        color: var(--fg-secondary);
      }
      .ProseMirror ul,
      .ProseMirror ol {
        padding-left: 24px;
        margin: 8px 0;
      }
      .ProseMirror pre {
        background: rgba(0, 0, 0, 0.32);
        border: 1px solid var(--border);
        padding: 12px 14px;
        border-radius: var(--radius);
        font-family: "SF Mono", Menlo, monospace;
        font-size: 14px;
        white-space: pre-wrap;
      }
      .ProseMirror code {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        padding: 1px 5px;
        font-family: "SF Mono", Menlo, monospace;
        font-size: 14px;
      }
      .ProseMirror a {
        color: var(--accent);
        text-decoration: underline;
      }
      .ProseMirror img:not(.callout-icon-image) {
        max-width: 100%;
        border-radius: var(--radius);
        display: block;
        margin: 10px 0;
      }

      /* Callout — wrapper is the real document node; icon is visual CSS. */
      .callout {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 58px 1fr;
        align-items: center;
        gap: 14px;
        background: linear-gradient(
          135deg,
          rgba(3, 219, 252, 0.10),
          rgba(125, 25, 247, 0.14)
        );
        border: 1px solid rgba(3, 219, 252, 0.42);
        border-radius: 14px;
        padding: 14px;
        margin: 12px 0;
        min-height: 76px;
        position: relative;
      }
      .callout-icon-button {
        appearance: none;
        -webkit-appearance: none;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        border: 0;
        border-radius: 10px;
        box-sizing: border-box;
        color: #ffffff;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        width: 58px;
        height: 58px;
        padding: 12px;
      }
      .callout-icon-button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .callout-icon-image {
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        margin: 0;
        border-radius: 0;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        pointer-events: none;
      }
      .callout-icon-image[hidden] {
        display: none;
      }
      .callout-content {
        min-width: 0;
      }
      .callout-content p {
        margin: 0;
      }
      .callout-content p + p {
        margin-top: 8px;
      }
      .callout-content > :first-child {
        margin-top: 0;
      }
      .callout-content > :last-child {
        margin-bottom: 0;
      }

      .file-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--fg);
        text-decoration: none;
        margin: 6px 0;
      }
      .file-chip::before {
        content: "\1F4CE";
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="editor-root"><div id="editor"></div></div>
    <!--
      Vendored Tiptap runtime. Regenerate with:
        cd ../../tiptap-build && npm install && npm run build
      Bundle is committed to source control so the app works offline
      without a rebuild step.
    -->
    <script src="./tiptap.bundle.js"></script>
  </body>
</html>
